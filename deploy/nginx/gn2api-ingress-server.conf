# Include inside the API virtual server. Review limits against legitimate
# concurrency, especially shared NAT/proxy addresses, before deploying.
limit_req zone=gn2api_key_rate burst=120 nodelay;
limit_req zone=gn2api_ip_rate burst=400 nodelay;
# Existing active users have a configured concurrency as high as 1000. Keep
# headroom for idle WS sessions instead of silently reducing that entitlement.
limit_conn gn2api_key_conn 2048;
limit_conn gn2api_ip_conn 4096;
limit_req_status 403;
limit_conn_status 403;
limit_req_log_level info;
limit_conn_log_level info;
error_page 403 = @gn2api_ingress_rejected;

client_header_timeout 10s;
client_body_timeout 15s;
# Authentication may reject without first buffering a multi-megabyte history.
proxy_request_buffering off;
proxy_http_version 1.1;
# Never intercept the application's ordinary 403 or SSE/WS failure events.
proxy_intercept_errors off;

location @gn2api_ingress_rejected {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header X-Should-Retry false always;
    add_header Retry-After 10 always;
    access_log off;
    return 403 '{"error":{"type":"access_denied","code":"ingress_rate_limited","message":"Gateway request or connection limit exceeded. Retry later."}}';
}
