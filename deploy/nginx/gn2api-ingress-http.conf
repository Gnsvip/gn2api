# Include inside http {}. Keys are in shared memory only; never add them to logs.
# Trust only verified proxy CIDRs via real_ip before using this behind a CDN.
map $http_authorization $gn2api_ingress_credential {
    default $http_authorization;
    "" $http_x_api_key;
}
map $gn2api_ingress_credential $gn2api_ingress_credential_fallback {
    default $gn2api_ingress_credential;
    "" $http_x_goog_api_key;
}
map $uri $gn2api_ingress_key {
    default "";
    ~^/(v1(/|$)|v1beta/|responses(/|$)|openai/v1/|backend-api/codex/|antigravity/) $gn2api_ingress_credential_fallback;
}
map $uri $gn2api_ingress_ip {
    default "";
    ~^/(v1(/|$)|v1beta/|responses(/|$)|openai/v1/|backend-api/codex/|antigravity/) $binary_remote_addr;
}

# Connection/request arrival limits, not response generation time limits.
limit_req_zone $gn2api_ingress_key zone=gn2api_key_rate:10m rate=30r/s;
limit_req_zone $gn2api_ingress_ip zone=gn2api_ip_rate:10m rate=100r/s;
limit_conn_zone $gn2api_ingress_key zone=gn2api_key_conn:10m;
limit_conn_zone $gn2api_ingress_ip zone=gn2api_ip_conn:10m;
